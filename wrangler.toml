# wrangler.toml - Cloudflare Pages + Next.js
name = 'skoleai'
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".vercel/output/static/_worker.js/index.js"

# For production: run `wrangler secret put GEMINI_API_KEY` and enter your key
# For local dev: use .dev.vars (copy from .dev.vars.example)

[site]
bucket = ".vercel/output/static"
